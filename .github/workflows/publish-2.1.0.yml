name: Publish NG Alarm 2.1.0
on:
  push:
    branches: ['release/v2.1.0']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v2.1.0 --repo NikGro/ng_alarm --target 37786dbfcffc14a03f2ab6c952546e73e008f20a --title "NG Alarm 2.1.0" --notes-file RELEASE_NOTES_v2.1.0.md --latest
