name: Update v2.0 release notes
on:
  push:
    branches: ['release-notes/v2.0']
permissions:
  contents: write
jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0 --repo NikGro/ng_alarm --title "NG Alarm 2.0" --notes-file RELEASE_NOTES_v2.0.md
